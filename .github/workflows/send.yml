name: Send Douyin Fire Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只验证登录和好友，不发送消息"
        type: boolean
        default: true
  schedule:
    - cron: "30 8 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: douyin-fire-keeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_TEMPLATE: ${{ secrets.WEBHOOK_TEMPLATE }}
      WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py --dry-run
          else
            python run.py
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-run-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
